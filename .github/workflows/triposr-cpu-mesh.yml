name: TripoSR CPU mesh backend
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
permissions:
  contents: read
jobs:
  build-cpu-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and build tools
        run: |
          python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install scikit-build-core pybind11 cmake ninja numpy
      - name: Build pinned CPU mesh backend
        run: |
          git clone https://github.com/tatsy/torchmcubes.git /tmp/torchmcubes
          git -C /tmp/torchmcubes checkout --detach 879926d0ef58e6ce0ac2630fdecb5e53af7ed3ff
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          worker = Path("gpu-workers/triposr/run-job.sh").read_text()
          configure = re.search(r"<<'CPU_BUILD'\n(.*?)\nCPU_BUILD", worker, re.DOTALL).group(1)
          subprocess.run([sys.executable, "-c", configure, "/tmp/torchmcubes"], check=True)
          PY
          CMAKE_BUILD_PARALLEL_LEVEL=2 python -m pip install --no-build-isolation /tmp/torchmcubes
      - name: Generate a real mesh
        run: |
          python - <<'PY'
          import torch, torchmcubes
          assert not torchmcubes.HAS_CUDA
          volume = torch.zeros((8,8,8), dtype=torch.float32)
          volume[2:6,2:6,2:6] = 1
          vertices, faces = torchmcubes.marching_cubes(volume, 0.5)
          assert vertices.numel() > 0 and faces.numel() > 0
          print("CPU mesh produced", len(vertices), "vertices and", len(faces), "faces")
          PY
