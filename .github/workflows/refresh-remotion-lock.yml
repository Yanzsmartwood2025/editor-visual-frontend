name: Refresh Remotion lockfile

on:
  push:
    branches: ["chore/remotion-professional-stack-526"]
    paths:
      - "package.json"
      - ".github/workflows/refresh-remotion-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remotion-professional-stack-526
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "Refresh lockfile for Remotion 4.0.526"
            git push origin HEAD:chore/remotion-professional-stack-526
          fi

# lock-refresh-trigger
